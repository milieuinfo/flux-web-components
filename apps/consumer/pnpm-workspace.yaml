# Deze overrides staan bewust ook hier: de consumer is een aparte pnpm-workspace die een externe
# afnemer simuleert en kan de root-overrides niet erven. Houd ze gelijk aan de root-versie.
overrides:
  color-parse>color-name: 2.0.0
  validator: 13.15.35
  '@babel/runtime': 7.26.10

strictDepBuilds: true

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@domg-wc/*'

allowBuilds:
  vue-demi: false
